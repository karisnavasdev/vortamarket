<html lang="en">

    :root {

      --paper2: #eff4ee;
      --ink: #0b2b1b;
      --pine: #14532d;
      --leaf: #1e8a4c;

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { scroll-behavior: auto; }
    body {

      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);

      overflow-x: hidden;

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .tape {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 60;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      overflow: hidden;
    }
    .tape-actions {
      position: absolute;
      top: 0; right: 0;
      height: 36px;

      align-items: center;
      gap: 18px;
      padding: 0 20px 0 32px;
      background: linear-gradient(90deg, #f7faf600, var(--paper) 18px);

    .tape-link {
      border: 0;
      padding: 0;
      background: none;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--pine);
      white-space: nowrap;

    .tape-link:hover { color: var(--leaf); }
    .tape-ca { text-transform: none; letter-spacing: 0.04em; }
    .tape-track {
      display: flex;
      width: max-content;
      animation: tape-move 64s linear infinite;

    .tape:hover .tape-track { animation-play-state: paused; }
    .tape-group { display: flex; align-items: center; height: 36px; }
    .tape-group span {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--pine);
      white-space: nowrap;
      padding: 0 38px;
    }
    @keyframes tape-move { to { transform: translateX(-50%); } }

    .hero-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--paper);
    }
    .hero-stage canvas { width: 100%; height: 100%; display: block; }
    .hero-story { height: 402.4vh; position: relative; }
    .pin {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
    }
    .hero {
      position: absolute;
      top: clamp(76px, 12vh, 140px);
      left: 0; right: 0;
      padding: 0 24px;
      text-align: center;
    }
    .word {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(64px, 13vw, 180px);

    .sub {

      font-family: var(--body);
      font-weight: 300;
      font-size: clamp(16px, 2.1vw, 24px);

    .zoomline {
      position: absolute;
      left: 0; right: 0;
      bottom: clamp(84px, 13vh, 150px);
      margin: 0;
      padding: 0 24px;
      text-align: center;
      font-family: var(--serif);
      font-size: clamp(20px, 2.8vw, 36px);
      color: var(--pine);
      opacity: 0;
    }
    .scroll-cue {
      position: absolute;
      left: 0; right: 0;
      bottom: clamp(26px, 4.5vh, 48px);
      text-align: center;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--brass);
      animation: cue-pulse 3.2s ease-in-out infinite;
    }
    .scroll-cue.is-hidden { opacity: 0; animation: none; }
    @keyframes cue-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .act {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: var(--paper);
      color: var(--ink);
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
    }
    .act.is-flow,
    .act.is-standalone {
      position: relative;
      inset: auto;
      overflow: visible;
      opacity: 1;
      visibility: visible;
      clip-path: none;
    }
    .act.is-flow { margin-top: -100vh; }
    .act.is-standalone { margin-top: 0; }

    .grass-story { height: 340vh; position: relative; }
    .grass-stage {
      position: sticky;
      top: 0;

    .grass-cue { bottom: 32px; }

    .close {
      position: relative;
      z-index: 3;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

    .close-sub {

    .close-form {

    .close-input {

    .close-cta {

    .close-cta.ghost {

    .close-cta.ghost:hover { background: var(--paper2); color: var(--pine); }
    .close-actions { display: flex; gap: 10px; width: 100%; max-width: 560px; }
    .close-actions .close-cta { flex: 1; }
    .ca {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 560px;
      padding: 14px 16px;
      border: 1px solid var(--rule);
      background: var(--paper);
      text-align: left;
    }
    .ca:hover { border-color: var(--pine); }
    .ca-label, .ca-state {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .ca-state { color: var(--ink); }
    .ca-value {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.02em;
      color: var(--pine);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footer { position: relative; z-index: 3; background: var(--paper2); border-top: 1px solid var(--rule); }
    .footer-inner { max-width: 1280px; margin: 0 auto; padding: 56px 44px; }
    .footer-grid {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 56px;
      align-items: start;
    }
    .footer-mark {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 40px;
      line-height: 1;
      color: var(--pine);
    }
    .footer-tag {
      margin: 0;
      font-weight: 300;
      font-size: 19px;
      color: var(--sage);
    }
    .footer-links { display: flex; flex-wrap: wrap; gap: 34px; align-items: center; }
    .footer-link {
      border: 0;
      padding: 0;
      background: none;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .footer-link:hover { color: var(--leaf); }
    .footer-domain {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sage);
      text-decoration: none;
    }
    .footer-domain:hover { color: var(--leaf); }
    .footer-ca { text-transform: none; letter-spacing: 0.04em; }

    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 60;
      background: #f7faf6e0;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }
    .header-inner {
      max-width: 1280px;
      height: 66px;
      margin: 0 auto;
      padding: 0 44px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 40px;
    }
    .mark {
      justify-self: start;
      border: 0;
      padding: 0;
      background: none;
      font-family: var(--serif);
      font-size: 26px;
      line-height: 1;
      color: var(--pine);
    }
    .nav { display: flex; gap: 40px; align-items: center; }
    .nav-item {
      border: 0;
      padding: 0;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .nav-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;

    .nav-line { width: 16px; height: 1px; background: var(--brass); display: block; }
    .header-end { justify-self: end; display: flex; align-items: center; gap: 22px; }
    .header-x, .header-ca {
      border: 0;
      padding: 0;
      background: none;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;

    .header-ca { text-transform: none; letter-spacing: 0.04em; color: var(--pine); }
    .header-x:hover, .header-ca:hover { color: var(--leaf); }

    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .soon, .legal {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 140px 44px 120px;
    }
    .soon { flex-direction: column; justify-content: center; text-align: center; gap: 26px; }
    .soon-title, .legal-title {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      color: var(--pine);
    }
    .soon-title {
      font-size: clamp(48px, 6vw, 92px);
      line-height: 0.94;
      letter-spacing: -0.02em;
    }
    .soon-badge {
      margin-top: 8px;
      padding: 14px 30px;
      border: 1px solid var(--brass);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .legal-wrap { width: 100%; max-width: 720px; margin: 0 auto; }
    .legal-title {
      margin: 0 0 34px;
      font-size: clamp(40px, 5vw, 72px);
      line-height: 1;
      letter-spacing: -0.015em;
    }
    .legal-kicker { margin: 0 0 26px; }
    .legal-body {
      margin: 0 0 20px;
      font-weight: 300;
      font-size: clamp(18px, 1.7vw, 23px);
      line-height: 1.6;
      text-wrap: pretty;
    }

    .static-hero {
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 40px;
    }
    .static-mid {
      display: flex;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 80px;
    }
    .static-mid h2 {
      max-width: 820px;
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(30px, 4.6vw, 64px);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--pine);
      text-wrap: balance;
    }

    @media (max-width: 860px) {
      .header-inner { grid-template-columns: 1fr auto; gap: 16px; padding: 0 20px; }
      .nav { display: none; }
      .close, .soon, .legal { padding-left: 20px; padding-right: 20px; }
      .footer-inner { padding: 40px 20px; }
      .footer-grid { grid-template-columns: 1fr; gap: 32px; }
    }
    @media (max-width: 560px) {
      .close-form, .close-actions { flex-direction: column; }
      .close-cta { width: 100%; }
      .tape-actions { gap: 12px; padding-right: 14px; }
      .header-end { gap: 14px; }
      .ca { flex-wrap: wrap; row-gap: 8px; }
      .ca-label, .ca-state { order: 0; }
      .ca-state { margin-left: auto; }
      .ca-value {
        flex: 1 0 100%;
        order: 1;
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        word-break: break-all;
        font-size: 11px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .tape-track, .scroll-cue { animation: none; }
      .hero-story, .grass-story { height: auto; }
    }
  </style>
</head>
<body>
  <div class="tape" id="tape">
    <div class="tape-track" id="tape-track" aria-hidden="true"></div>
    <div class="tape-actions">
      <a class="tape-link" href="https://x.com/vortamarket" target="_blank" rel="noopener noreferrer">X</a>
      <button class="tape-link tape-ca" type="button" data-copy-ca>0xc4bc...e39e</button>
    </div>
  </div>

  <div id="home"></div>
  <div id="inner" hidden></div>

  <template id="footer-template">
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-grid">
          <div>
            <p class="footer-mark">Vorta</p>
            <p class="footer-tag">The market before the market.</p>
          </div>
          <div class="footer-links">
            <button class="footer-link" type="button" data-go="home">Home</button>
            <button class="footer-link" type="button" data-go="markets">Markets</button>
            <button class="footer-link" type="button" data-go="reserves">Reserves</button>
            <button class="footer-link" type="button" data-go="docs">Docs</button>
            <button class="footer-link" type="button" data-go="disclosures">Disclosures</button>
            <a class="footer-link" href="https://x.com/vortamarket" target="_blank" rel="noopener noreferrer">X</a>
            <button class="footer-link footer-ca" type="button" data-copy-ca>0xc4bc...e39e</button>
            <a class="footer-domain" href="https://vorta-market.com">vorta-market.com</a>
          </div>
        </div>
      </div>
    </footer>
  </template>

  <script>
    const TICKERS = ["vATOMS", "vANTHROPIC", "vBLUEORIGIN", "vTETHER", "vDISCORD"];
    const CA = "0xc4bcdadf30e264de7b94099bb535669ad618e39e";
    const X_URL = "https://x.com/vortamarket";
    const CHART_URL = "https://dexscreener.com/robinhood/0x9dd43b587f36263bc5ee540a9776064abab8e043c1c67f115d78c1a7e519764d";
    const PAPER = "#F7FAF6";
    const INK_RAMP = [[203, 228, 209], [143, 196, 160], [63, 164, 102], [20, 83, 45], [11, 43, 27]];
    const GRASS_RAMP = [[220, 232, 222], [30, 138, 76], [20, 83, 45]];
    const PAGES = {
      markets: { kicker: "The course", title: "Markets" },
      reserves: { kicker: "The paddock", title: "Reserves" },
      docs: { kicker: "The form", title: "Docs" }
    };

    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const state = { route: "home", diveSeen: false };

    const tape = document.getElementById("tape");
    const home = document.getElementById("home");
    const inner = document.getElementById("inner");

    function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function smooth(v) { v = clamp(v); return v * v * (3 - 2 * v); }
    function ramp(stops, t) {
      const x = Math.min(0.999, Math.max(0, t)) * (stops.length - 1);
      const i = Math.floor(x);
      const f = x - i;
      const a = stops[i];
      const b = stops[i + 1] || a;
      return `rgb(${Math.round(lerp(a[0], b[0], f))},${Math.round(lerp(a[1], b[1], f))},${Math.round(lerp(a[2], b[2], f))})`;
    }
    function hash(x, y, z) {
      const n = 43758.5453 * Math.sin(127.1 * x + 311.7 * y + 74.7 * (z || 0));
      return n - Math.floor(n);
    }
    function monoStack() {
      return '"IBM Plex Mono", ui-monospace, Menlo, monospace';
    }

    function buildTape() {
      const track = document.getElementById("tape-track");
      for (let g = 0; g < 2; g++) {
        const group = document.createElement("div");
        group.className = "tape-group";
        for (let r = 0; r < 4; r++) {
          for (const name of TICKERS) {
            const span = document.createElement("span");
            span.textContent = name;
            group.appendChild(span);
          }
        }
        track.appendChild(group);
      }
    }

    function footerHTML() {
      return document.getElementById("footer-template").innerHTML;
    }

    function shortCA() {
      return CA.slice(0, 6) + "..." + CA.slice(-4);
    }

    function closeHTML() {
      return `
        <section class="close">
          <p class="kicker">Robinhood Chain</p>
          <p class="close-sub">Pre-IPO tokenised stocks. Vorta publishes the reference mark, and that mark trades around the clock.</p>
          <button class="ca" type="button" data-copy-ca>
            <span class="ca-label">VORTA</span>
            <span class="ca-value">${CA}</span>
            <span class="ca-state" data-copy-label>Copy</span>
          </button>
          <div class="close-actions">
            <a class="close-cta" href="${CHART_URL}" target="_blank" rel="noopener noreferrer">Chart</a>
            <a class="close-cta ghost" href="${X_URL}" target="_blank" rel="noopener noreferrer">X</a>
          </div>
        </section>`;
    }

    function bindFooter(root) {
      root.querySelectorAll("[data-go]").forEach((btn) => {
        btn.addEventListener("click", () => go(btn.dataset.go));
      });
    }

    function copyCA(button) {
      const label = button.querySelector("[data-copy-label]");
      const target = label || button;
      const idle = target.dataset.idle || target.textContent;
      target.dataset.idle = idle;
      const done = () => {
        target.textContent = "Copied";
        setTimeout(() => { target.textContent = target.dataset.idle; }, 1400);
      };
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = CA;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        if (ok) done();
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(CA).then(done).catch(fallback);
      } else {
        fallback();
      }
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-copy-ca]");
      if (button) copyCA(button);
    });

    function headerHTML(active) {
      const items = [
        ["home", "Home"],
        ["markets", "Markets"],
        ["reserves", "Reserves"],
        ["docs", "Docs"]
      ];
      const nav = items.map(([id, label]) => `
        <button class="nav-item" type="button" data-go="${id}">
          <span class="nav-label">${label}</span>
          ${active === id ? '<span class="nav-line"></span>' : ""}
        </button>`).join("");
      return `
        <header class="site-header">
          <div class="header-inner">
            <button class="mark" type="button" data-go="home">Vorta</button>
            <nav class="nav">${nav}</nav>
            <div class="header-end">
              <a class="header-x" href="${X_URL}" target="_blank" rel="noopener noreferrer">X</a>
              <button class="header-ca" type="button" data-copy-ca>${shortCA()}</button>
            </div>
          </div>
        </header>`;
    }

    let stopHome = () => {};

    function render() {
      stopHome();
      stopHome = () => {};
      window.scrollTo(0, 0);

      if (state.route !== "home") {
        tape.hidden = true;
        home.hidden = true;
        home.innerHTML = "";
        inner.hidden = false;
        if (state.route === "disclosures") {
          inner.innerHTML = `
            <div class="page">
              ${headerHTML("disclosures")}
              <section class="legal">
                <div class="legal-wrap">
                  <p class="kicker legal-kicker">Disclosures</p>
                  <h1 class="legal-title">No rights, no claims.</h1>
                  <p class="legal-body">Tracker tokens give price exposure to a published reference mark and grant no interest in any company.</p>
                  <p class="legal-body">Not available to persons in the United States, European Union, United Kingdom, or Singapore.</p>
                </div>
              </section>
              ${footerHTML()}
            </div>`;
        } else {
          const page = PAGES[state.route];
          inner.innerHTML = `
            <div class="page">
              ${headerHTML(state.route)}
              <section class="soon">
                <p class="kicker">${page.kicker}</p>
                <h1 class="soon-title">${page.title}</h1>
                <span class="soon-badge">Coming soon</span>
              </section>
              ${footerHTML()}
            </div>`;
        }
        bindFooter(inner);
        document.title = state.route === "home" ? "Vorta Market" : pageTitle(state.route);
        return;
      }

      tape.hidden = false;
      inner.hidden = true;
      inner.innerHTML = "";
      home.hidden = false;
      document.title = "Vorta Market";

      if (reduced) {
        home.innerHTML = `
          <section class="static-hero">
            <h1 class="word">Vorta</h1>
            <p class="sub">The market before the market</p>
          </section>
          <section class="static-mid">
            <h2>Get Exposure To Leading Private Pre-IPO Companies</h2>
          </section>
          ${closeHTML()}
          ${footerHTML()}`;
        bindFooter(home);
        return;
      }

      if (state.diveSeen) {
        home.innerHTML = `
          <div class="act is-standalone" id="act">
            <section class="grass-story" id="grass-story">
              <div class="grass-stage" id="grass-stage">
                <canvas id="grass" aria-hidden="true"></canvas>
                <div class="grass-hero" id="grass-hero">
                  <h1 class="word">Vorta</h1>
                  <p class="sub">The market before the market</p>
                </div>
                <p class="midline" id="midline">Get Exposure To Leading Private Pre-IPO Companies</p>
                <div class="scroll-cue grass-cue" id="grass-cue">Scroll</div>
              </div>
            </section>
            ${closeHTML()}
            ${footerHTML()}
          </div>`;
        bindFooter(home);
        stopHome = startGrass();
        return;
      }

      home.innerHTML = `
        <div class="hero-stage" id="hero-stage">
          <canvas id="reel" aria-hidden="true"></canvas>
        </div>
        <section class="hero-story" id="hero-story">
          <div class="pin">
            <div class="hero" id="hero">
              <h1 class="word">Vorta</h1>
              <p class="sub">The market before the market</p>
            </div>
            <p class="zoomline" id="zoomline">Behind every price there is a door.</p>
            <div class="scroll-cue" id="scroll-cue">Scroll</div>
          </div>
        </section>
        <div class="act" id="act">
          <section class="grass-story" id="grass-story">
            <div class="grass-stage" id="grass-stage">
              <canvas id="grass" aria-hidden="true"></canvas>
              <p class="midline" id="midline">Get Exposure To Leading Private Pre-IPO Companies</p>
            </div>
          </section>
          ${closeHTML()}
          ${footerHTML()}
        </div>`;
      bindFooter(home);
      stopHome = startExperience();
    }

    function pageTitle(route) {
      if (route === "disclosures") return "Disclosures — Vorta Market";
      const page = PAGES[route];
      return page ? page.title + " — Vorta Market" : "Vorta Market";
    }

    function go(route) {
      if (state.route === "home" && route !== "home") state.diveSeen = true;
      state.route = route;
      render();
    }

    function startExperience() {
      const stage = document.getElementById("hero-stage");
      const canvas = document.getElementById("reel");
      const story = document.getElementById("hero-story");
      const hero = document.getElementById("hero");
      const zoomline = document.getElementById("zoomline");
      const cue = document.getElementById("scroll-cue");
      const act = document.getElementById("act");
      const ctx = canvas.getContext("2d", { alpha: false });
      const sample = document.createElement("canvas");
      const sctx = sample.getContext("2d", { willReadFrequently: true });
      const img = new Image();
      img.decoding = "async";

      let width = 0;
      let height = 0;
      let cols = 0;
      let rows = 0;
      let cellW = 0;
      let cellH = 0;
      let fontPx = 0;
      let bits = new Float32Array(0);
      let bits2 = new Float32Array(0);
      let lum = null;
      let door = null;
      let ready = false;
      let dead = false;
      let inFlow = false;

      function layout() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = stage.clientWidth;
        height = stage.clientHeight;
        if (!width || !height) return;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        cellW = Math.max(width < 480 ? 7 : 9, Math.round(width / 118));
        cellH = Math.round(cellW * 1.35);
        fontPx = cellW * 1.1;
        cols = Math.ceil(width / cellW);
        rows = Math.ceil(height / cellH);
        const count = cols * rows;
        bits = new Float32Array(count);
        bits2 = new Float32Array(count);
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const i = y * cols + x;
            const a = 43758.5453 * Math.sin(127.1 * x + 311.7 * y);
            const b = 24634.6345 * Math.sin(269.5 * x + 183.3 * y);
            bits[i] = a - Math.floor(a);
            bits2[i] = b - Math.floor(b);
          }
        }
        lum = null;
        door = null;
      }

      function imageRect() {
        const ratio = img.naturalWidth / img.naturalHeight;
        const view = width / height;
        if (view < 0.75 * ratio) {
          const dw = (0.86 * width) / 0.475;
          const dh = dw / ratio;
          return {
            dx: width / 2 - 0.4175 * dw,
            dy: 0.56 * height - ((0.392 + 0.808) / 2) * dh,
            dw,
            dh
          };
        }
        let dw;
        let dh;
        if (view > ratio) {
          dw = width;
          dh = width / ratio;
        } else {
          dh = height;
          dw = height * ratio;
        }
        return { dx: (width - dw) / 2, dy: (height - dh) / 2, dw, dh };
      }

      function luminance() {
        if (lum) return lum;
        sample.width = cols;
        sample.height = rows;
        sctx.fillStyle = PAPER;
        sctx.fillRect(0, 0, cols, rows);
        const rect = imageRect();
        sctx.drawImage(img, rect.dx / cellW, rect.dy / cellH, rect.dw / cellW, rect.dh / cellH);
        const data = sctx.getImageData(0, 0, cols, rows).data;
        lum = new Uint8Array(cols * rows);
        for (let i = 0; i < lum.length; i++) {
          lum[i] = (0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2]) | 0;
        }
        return lum;
      }

      function findDoor(map) {
        if (door) return door;
        let best = null;
        let bestDist = Infinity;
        const tx = 0.76 * cols;
        const ty = 0.26 * rows;
        for (let y = 2; y < rows - 2; y++) {
          for (let x = 2; x < cols - 2; x++) {
            const i = y * cols + x;
            if (bits[i] > 0.5 || 1 - map[i] / 255 > 0.05) continue;
            const d = (x - tx) * (x - tx) + (y - ty) * (y - ty);
            if (d < bestDist) {
              bestDist = d;
              best = { x, y };
            }
          }
        }
        const x = best ? best.x : tx | 0;
        const y = best ? best.y : ty | 0;
        door = { x, y, px: x * cellW + cellW / 2, py: y * cellH + cellH / 2 };
        return door;
      }

      function superellipse(cx, cy, rx, ry, exp) {
        const pts = [];
        const power = 2 / exp;
        for (let i = 0; i < 64; i++) {
          const a = (i / 64) * Math.PI * 2;
          const c = Math.cos(a);
          const s = Math.sin(a);
          pts.push([
            cx + rx * Math.sign(c) * Math.pow(Math.abs(c), power),
            cy + ry * Math.sign(s) * Math.pow(Math.abs(s), power)
          ]);
        }
        return pts;
      }

      function path(ctx2, pts) {
        ctx2.beginPath();
        ctx2.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx2.lineTo(pts[i][0], pts[i][1]);
        ctx2.closePath();
      }

      function draw() {
        if (dead || !width || !height) return;
        const span = story.offsetHeight - height;
        const progress = clamp(span > 0 ? window.scrollY / span : 0);
        ctx.fillStyle = PAPER;
        ctx.fillRect(0, 0, width, height);

        const opened = progress >= 0.999;
        if (!inFlow && opened) {
          inFlow = true;
          act.classList.add("is-flow");
          act.style.clipPath = "none";
          act.style.opacity = "1";
          act.style.visibility = "visible";
        }
        stage.style.opacity = inFlow && opened ? "0" : "1";

        if (ready && !opened) {
          const map = luminance();
          const spot = findDoor(map);
          const zoomT = smooth((progress - 0.38) / 0.48);
          const openT = smooth((progress - 0.86) / 0.14);
          const scale = Math.pow(36, zoomT);
          const centerT = smooth(1.4 * zoomT);
          const focusX = lerp(spot.px, width / 2, centerT);
          const focusY = lerp(spot.py, height / 2, centerT);
          const originX = spot.px - (focusX - width / 2) / scale;
          const originY = spot.py - (focusY - height / 2) / scale;
          const digitFade = scale < 5 ? 1 : Math.max(0, 1 - (scale - 5) / 12);
          const doorIn = smooth(1.2 * clamp((scale - 14) / 22));

          if (openT < 0.999) {
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.scale(scale, scale);
            ctx.translate(-originX, -originY);
            ctx.font = fontPx + "px " + monoStack();
            const x0 = Math.max(0, Math.floor((originX - (width / 2 + cellW) / scale) / cellW));
            const x1 = Math.min(cols - 1, Math.ceil((originX + (width / 2 + cellW) / scale) / cellW));
            const y0 = Math.max(0, Math.floor((originY - (height / 2 + cellH) / scale) / cellH));
            const y1 = Math.min(rows - 1, Math.ceil((originY + (height / 2 + cellH) / scale) / cellH));
            for (let y = y0; y <= y1; y++) {
              const row = y * cols;
              const py = y * cellH + cellH / 2;
              for (let x = x0; x <= x1; x++) {
                const i = row + x;
                const px = x * cellW + cellW / 2;
                if (spot.x === x && spot.y === y) {
                  const fade = 1 - doorIn;
                  if (fade > 0.01) {
                    ctx.globalAlpha = fade;
                    ctx.fillStyle = ramp(INK_RAMP, 0.9);
                    ctx.fillText("0", px, py);
                    ctx.globalAlpha = 1;
                  }
                  continue;
                }
                if (digitFade <= 0.01) continue;
                const darkness = 1 - map[i] / 255;
                const ink = darkness > 0.055;
                if (!ink && bits2[i] > 0.2) continue;
                ctx.globalAlpha = digitFade;
                ctx.fillStyle = ink
                  ? ramp(INK_RAMP, Math.min(1, Math.max(0.42, 1.35 * darkness + 0.05 * Math.sin(97 * bits[i]))))
                  : "#DCE8DE";
                ctx.fillText(bits[i] > 0.5 ? "1" : "0", px, py);
              }
            }
            ctx.restore();
            ctx.globalAlpha = 1;
          }

          if (doorIn > 0.01) {
            const diag = Math.hypot(width, height);
            const exp = lerp(2, 9, Math.max(doorIn, smooth(openT / 0.3)));
            const round = Math.max(doorIn, smooth(openT / 0.2)) * (1 - smooth((openT - 0.55) / 0.45));
            const ry = lerp(0.42 * fontPx * scale, diag, openT);
            const rx = lerp(lerp(0.3 * fontPx * scale, diag, openT), 0.46 * ry, round);
            const pts = superellipse(focusX, focusY, rx, ry, exp);
            ctx.save();
            path(ctx, pts);
            ctx.clip();
            ctx.fillStyle = PAPER;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
            if (!inFlow) {
              act.style.visibility = "visible";
              act.style.clipPath = "polygon(" + pts.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",") + ")";
              act.style.opacity = String(openT > 0.02 ? smooth(openT / 0.55) : 0);
            } else {
              act.style.clipPath = "none";
              act.style.opacity = "1";
              act.style.visibility = "visible";
            }
            ctx.globalAlpha = doorIn * (1 - openT);
            ctx.strokeStyle = ramp(INK_RAMP, 0.95);
            ctx.lineWidth = Math.max(2, 0.12 * fontPx * scale * (1 - 0.8 * openT));
            ctx.lineJoin = "round";
            path(ctx, pts);
            ctx.stroke();
            ctx.globalAlpha = 1;
          } else if (!inFlow) {
            act.style.visibility = "hidden";
            act.style.opacity = "0";
            act.style.clipPath = "none";
          }
        }

        if (inFlow && opened) {
          act.style.clipPath = "none";
          act.style.opacity = "1";
          act.style.visibility = "visible";
        }

        hero.style.opacity = String(1 - clamp((progress - 0.3) / 0.12));
        hero.style.transform = "translateY(" + (-70 * clamp(progress / 0.42)).toFixed(1) + "px)";
        zoomline.style.opacity = String(clamp((progress - 0.58) / 0.1) * (1 - clamp((progress - 0.9) / 0.07)));
        cue.classList.toggle("is-hidden", window.scrollY > 2);
      }

      img.onload = () => {
        ready = true;
        const fonts = document.fonts;
        if (fonts) {
          fonts.load("16px " + monoStack()).catch(() => {}).then(() => fonts.ready).then(() => {
            if (dead) return;
            layout();
            draw();
          }).catch(() => { if (!dead) { layout(); draw(); } });
        } else {
          layout();
          draw();
        }
      };
      img.src = "frames/f_0001.webp";
      layout();
      draw();

      const onScroll = () => draw();
      const onResize = () => { layout(); draw(); };
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onResize);
      const stopGrass = startGrass();
      return () => {
        dead = true;
        window.removeEventListener("scroll", onScroll);
        window.removeEventListener("resize", onResize);
        img.onload = null;
        stopGrass();
      };
    }

    function startGrass() {
      const story = document.getElementById("grass-story");
      const stage = document.getElementById("grass-stage");
      const canvas = document.getElementById("grass");
      const midline = document.getElementById("midline");
      const hero = document.getElementById("grass-hero");
      const cue = document.getElementById("grass-cue");
      if (!canvas || !stage) return () => {};
      const ctx = canvas.getContext("2d", { alpha: false });
      let width = 0;
      let height = 0;
      let pointerX = -9999;
      let pointerY = -9999;
      let dirty = true;
      let dead = false;
      let frame = 0;

      function layout() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        width = stage.clientWidth;
        height = stage.clientHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dirty = true;
      }

      function drawField(progress) {
        ctx.fillStyle = PAPER;
        ctx.fillRect(0, 0, width, height);
        const horizon = 0.62 * height;
        const origin = 0.34 * height;
        const shift = 52 * progress;
        const spacing = Math.max(14, width / 60);
        const reach = Math.max(110, 0.11 * width);
        for (let row = 96; row >= 5; row--) {
          const depth = row - shift;
          if (depth < 0.5) continue;
          const scale = horizon / (0.14 * horizon + 34 * depth);
          const blade = Math.min(110, spacing * scale * 2.4);
          if (blade < 3) continue;
          const y = origin + 1.35 * horizon * scale;
          if (y > height + 60) continue;
          for (let col = -46; col <= 46; col++) {
            if (hash(col, row, 1) > 0.62) continue;
            const x = width / 2 + col * spacing * scale * 2.6;
            if (x < -60 || x > width + 60) continue;
            const dist = Math.hypot(x - pointerX, y - pointerY);
            let influence = dist < reach ? 1 - dist / reach : 0;
            influence *= influence;
            const shade = 0.25 * hash(col, row, 2);
            const len = blade * (1.15 + 0.7 * hash(col, row, 4)) * (1 + 0.25 * influence);
            const lean = (hash(col, row, 5) - 0.5) * blade * 0.5;
            const wind = influence > 0 ? (x < pointerX ? -1 : 1) * influence * blade * 0.9 : 0;
            ctx.lineWidth = Math.min(3, Math.max(0.6, 0.045 * blade));
            ctx.strokeStyle = ramp(GRASS_RAMP, 0.62 * Math.min(1, 1.6 * shade + 1.1 * influence + 0.12));
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + (lean + wind) * 0.35, y - 0.62 * len, x + lean + wind, y - len);
            ctx.stroke();
          }
        }
        if (progress > 0.86) {
          ctx.globalAlpha = (progress - 0.86) / 0.14;
          ctx.fillStyle = PAPER;
          ctx.fillRect(0, 0, width, height);
          ctx.globalAlpha = 1;
        }
      }

      function tick() {
        if (dead) return;
        frame = requestAnimationFrame(tick);
        if (!dirty || !width) return;
        dirty = false;
        const rect = story.getBoundingClientRect();
        const span = rect.height - height;
        const progress = reduced ? 0 : clamp(span > 0 ? -rect.top / span : 0);
        drawField(progress);
        if (hero) hero.style.opacity = String(Math.max(0, 1 - progress / 0.22));
        const fadeIn = clamp((progress - 0.3) / 0.12);
        const fadeOut = clamp((progress - 0.72) / 0.1);
        if (midline) midline.style.opacity = String(fadeIn * (1 - fadeOut));
        if (cue) cue.classList.toggle("is-hidden", scrollY > 4);
      }

      function onScroll() { dirty = true; }
      function onResize() { layout(); }
      function onMove(event) {
        const rect = stage.getBoundingClientRect();
        pointerX = event.clientX - rect.left;
        pointerY = event.clientY - rect.top;
        dirty = true;
      }
      function onLeave() {
        pointerX = pointerY = -9999;
        dirty = true;
      }

      layout();
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onResize);
      stage.addEventListener("pointermove", onMove);
      stage.addEventListener("pointerleave", onLeave);
      tick();

      return () => {
        dead = true;
        cancelAnimationFrame(frame);
        window.removeEventListener("scroll", onScroll);
        window.removeEventListener("resize", onResize);
        stage.removeEventListener("pointermove", onMove);
        stage.removeEventListener("pointerleave", onLeave);
      };
    }

    buildTape();
    render();
  </script>
</body>
</html>
